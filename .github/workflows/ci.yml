name: TeacherOA CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: teacher_oa_service

jobs:
  verify:
    name: Rust Workspace & Frontend Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: teacher_oa
          POSTGRES_PASSWORD: teacher_oa_ci
          POSTGRES_DB: teacher_oa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teacher_oa -d teacher_oa_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - name: Restore Cargo build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: teacher_oa_service

      - name: Setup Bun runtime (1.4.4)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy static analysis
        run: cargo clippy --workspace --all-targets --features openapi,metrics -- -D warnings

      - name: Run workspace unit & integration tests
        run: cargo test --workspace --features openapi,metrics

      - name: Run PostgreSQL identity integration suite
        run: cargo test --features openapi --test postgres_identity -- --ignored
        env:
          ASTER_TEST_DATABASE_URL: postgres://teacher_oa:teacher_oa_ci@127.0.0.1:5432/teacher_oa_test

      - name: Run PostgreSQL achievements integration suite
        run: cargo test --features openapi --test postgres_achievements -- --ignored
        env:
          ASTER_TEST_DATABASE_URL: postgres://teacher_oa:teacher_oa_ci@127.0.0.1:5432/teacher_oa_test

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: teacher_oa_service/frontend-panel

      - name: Verify OpenAPI TypeScript contract sync
        run: bun run generate-api
        working-directory: teacher_oa_service/frontend-panel

      - name: Assert generated API artifacts are clean
        run: git diff --exit-code -- frontend-panel/generated/openapi.json frontend-panel/src/types/api.generated.ts frontend-panel/src/types/generated

      - name: Run frontend typecheck & Biome lint
        run: bun run check
        working-directory: teacher_oa_service/frontend-panel

      - name: Run frontend unit tests
        run: bun run test
        working-directory: teacher_oa_service/frontend-panel

      - name: Build production frontend bundle
        run: bun run build
        working-directory: teacher_oa_service/frontend-panel

      - name: Install Playwright Chromium browser
        run: bunx playwright install --with-deps chromium
        working-directory: teacher_oa_service/frontend-panel

      - name: Build TeacherOA service with embedded frontend
        run: cargo build --features openapi,metrics

      - name: Start TeacherOA service
        env:
          ASTER_CONFIG: config.development.toml
          ASTER__AUTH__MOCK_ENABLED: "true"
          ASTER__AUTH__MOCK_SEED: "true"
          ASTER__DATABASE__URL: postgres://teacher_oa:teacher_oa_ci@127.0.0.1:5432/teacher_oa_test
        run: |
          ./target/debug/teacher_oa_service > "$RUNNER_TEMP/teacheroa.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/teacheroa.log"
          exit 1

      - name: Run Playwright E2E suite
        run: bun run test:e2e
        working-directory: teacher_oa_service/frontend-panel
