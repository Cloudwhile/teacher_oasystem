name: TeacherOA CI
on: [push, pull_request]
permissions:
  contents: read
defaults:
  run:
    working-directory: teacher_oa_service
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: teacher_oa
          POSTGRES_PASSWORD: teacher_oa_ci
          POSTGRES_DB: teacher_oa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U teacher_oa -d teacher_oa_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: teacher_oa_service
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features openapi,metrics -- -D warnings
      - run: cargo test --workspace --features openapi,metrics
      - run: cargo test --features openapi --test postgres_identity -- --ignored
        env:
          ASTER_TEST_DATABASE_URL: postgres://teacher_oa:teacher_oa_ci@127.0.0.1:5432/teacher_oa_test
      - run: cargo test --features openapi --test postgres_achievements -- --ignored
        env:
          ASTER_TEST_DATABASE_URL: postgres://teacher_oa:teacher_oa_ci@127.0.0.1:5432/teacher_oa_test
      - run: bun install --frozen-lockfile
        working-directory: teacher_oa_service/frontend-panel
      - run: bun run generate-api
        working-directory: teacher_oa_service/frontend-panel
      - run: git diff --exit-code -- frontend-panel/generated/openapi.json frontend-panel/src/types/api.generated.ts frontend-panel/src/types/generated
      - run: bun run check
        working-directory: teacher_oa_service/frontend-panel
      - run: bun run test
        working-directory: teacher_oa_service/frontend-panel
      - run: bun run build
        working-directory: teacher_oa_service/frontend-panel
      - run: bunx playwright install --with-deps chromium
        working-directory: teacher_oa_service/frontend-panel
      - run: cargo build --features openapi,metrics
      - name: Start TeacherOA service
        env:
          ASTER_CONFIG: config.development.toml
          ASTER__DATABASE__URL: postgres://teacher_oa:teacher_oa_ci@127.0.0.1:5432/teacher_oa_test
        run: |
          ./target/debug/teacher_oa_service > "$RUNNER_TEMP/teacheroa.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/teacheroa.log"
          exit 1
      - run: bun run test:e2e
        working-directory: teacher_oa_service/frontend-panel
