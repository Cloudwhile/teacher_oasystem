name: teacheroa-development
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: teacher_oa
      POSTGRES_PASSWORD: teacher_oa_local
      POSTGRES_DB: teacher_oa
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teacher_oa -d teacher_oa"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["files"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: teacher_oa_local
      MINIO_ROOT_PASSWORD: teacher_oa_local_only
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio_data:/data
volumes:
  postgres_data:
  redis_data:
  minio_data:
